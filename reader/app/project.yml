name: LEDTalks
options:
  bundleIdPrefix: com.nakomis
  deploymentTarget:
    iOS: "17.0"
packages:
  LEDTalksKit:
    path: ../LEDTalksKit
targets:
  LEDTalks:
    type: application
    platform: iOS
    sources: [LEDTalks]
    dependencies:
      - package: LEDTalksKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nakomis.ledtalks
        PRODUCT_NAME: LEDTalks
        DEVELOPMENT_TEAM: 62YFUFBSFX
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "LED Talks"
        INFOPLIST_KEY_NSCameraUsageDescription: "LED Talks films a device's LED to read the status it blinks."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: "armv7 still-camera"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
schemes:
  LEDTalks:
    build:
      targets:
        LEDTalks: all
